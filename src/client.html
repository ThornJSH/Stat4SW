  function friendlyError(err) {

    if (/Service invoked too many times|too many times|Quota|quota exceeded/i.test(m)) return '짧은 시간에 구글 서비스를 너무 많이 호출해 한도에 걸렸습니다. 몇 분 뒤에 다시 시도하세요.';

      if (o.type === 'number') {
        var val = opts[o.key] !== undefined ? opts[o.key] : String(o.def);
        return '<label class="num"><span>' + esc(o.label) + '</span><input type="text" inputmode="decimal" data-optnum="' + esc(o.key) + '" value="' + esc(val) + '"></label>';
      }
      if (o.type === 'select') {
        var cur = opts[o.key] !== undefined ? opts[o.key] : o.def;
        return '<label class="num"><span>' + esc(o.label) + '</span><select data-optsel="' + esc(o.key) + '">' + o.choices.map(function (c) {
          return '<option value="' + esc(c[0]) + '"' + (c[0] === cur ? ' selected' : '') + '>' + esc(c[1]) + '</option>';
        }).join('') + '</select></label>';
      }
      var on = opts[o.key] !== undefined ? opts[o.key] : !!o.def;
      return '<label><input type="checkbox" data-opt="' + esc(o.key) + '"' + (on ? ' checked' : '') + '> ' + esc(o.label) + '</label>';
    };
    // 기본 옵션은 늘 보이고, 자주 바꾸지 않는 세부 옵션은 접어 둔다 (기본값에서 바뀐 것이 있으면 펼쳐서 보여 준다)
    var basic = a.options.filter(function (o) { return !o.adv; });
    var adv = a.options.filter(function (o) { return o.adv; });
    var changed = adv.some(function (o) {
      return opts[o.key] !== undefined && (o.type === 'number' || o.type === 'select' ? String(opts[o.key]) !== String(o.def) : !!opts[o.key] !== !!o.def);
    });
    $('options').innerHTML = a.options.length
      ? '<div class="opts"><div class="opts-title">옵션</div>' + basic.map(optHtml).join('') +
        (adv.length ? '<details class="adv"' + (state.advOpen[state.analysis] || changed ? ' open' : '') + '><summary>세부 옵션 (' + adv.length + '개)</summary>' + adv.map(optHtml).join('') + '</details>' : '') + '</div>'
      : '';
    renderExtras();
    renderVars();
  }

  /* ---------- 값을 보고 고르는 추가 설정 (로지스틱: 사건으로 볼 값, 기준 범주) ---------- */

  function extrasState() {
    return state.extras[state.analysis] = state.extras[state.analysis] || { mode: 'auto', depName: '', events: {}, atLeast: '', refs: {} };
  }

  function roleList(key) {
    var r = currentAnalysis().roles.filter(function (x) { return x.key === key; })[0];
    return r ? assignOf(r) : [];
  }

  function valueText(v) { return v.key + (v.label ? ' — ' + v.label : '') + '  (N=' + v.count + ')'; }

  function renderExtras() {
    var box = $('extras');
    if (currentAnalysis().extras !== 'logistic') { box.innerHTML = ''; return; }
    var ex = extrasState();
    var dep = roleList('dependent')[0] || '';
    var facs = roleList('factors');
    if (ex.depName !== dep) { ex.depName = dep; ex.mode = 'auto'; ex.events = {}; ex.atLeast = ''; }
    // 아직 모르는 변수의 값 목록을 서버에서 한꺼번에 불러온다 (불러온 뒤 다시 그린다)
    var fetchList = (dep ? [dep] : []).concat(facs).filter(function (n) { return !state.summaries[n] && !state.loading[n]; });
    if (fetchList.length) {
      fetchList.forEach(function (n) { state.loading[n] = true; });
      google.script.run
        .withSuccessHandler(function (map) {
          fetchList.forEach(function (n) { delete state.loading[n]; state.summaries[n] = map[n] || { error: '값 목록을 받지 못했습니다.' }; });
          renderExtras();
        })
        .withFailureHandler(function (err) {
          fetchList.forEach(function (n) { delete state.loading[n]; state.summaries[n] = { error: err.message || String(err) }; });
          renderExtras();
        })
        .getValueSummaries(fetchList);
    }
    var wait = '<span class="muted">값 목록을 불러오는 중…</span>';
    var html = '';
    if (dep) {
      var s = state.summaries[dep];
      html += '<div class="opts"><div class="opts-title">사건(1)으로 볼 값 — ' + esc(dep) + '</div>';
      if (!s) html += wait;
      else if (s.error) html += '<span class="error">' + esc(s.error) + '</span>';
      else {
        var keys = {};
        s.values.forEach(function (v) { keys[v.key] = true; });
        Object.keys(ex.events).forEach(function (k) { if (!keys[k]) delete ex.events[k]; });
        if (ex.mode === 'values' && s.truncated) ex.mode = 'auto';
        if (ex.mode === 'atLeast' && !s.numeric) ex.mode = 'auto';
        var radio = function (mode, text, disabled) {
          return '<label><input type="radio" name="evmode" value="' + mode + '"' + (ex.mode === mode ? ' checked' : '') + (disabled ? ' disabled' : '') + '> ' + text + '</label>';
        };
        html += radio('auto', '자동 (값이 2가지일 때 큰 값이 사건)');
        html += radio('values', s.truncated ? '값 직접 고르기 (값이 ' + s.valueCount + '가지로 너무 많음)' : '값을 직접 고르기 (3가지 이상도 가능)', s.truncated);
        if (ex.mode === 'values') {
          html += '<div class="sub">' + s.values.map(function (v) {
            return '<label><input type="checkbox" data-ev="' + esc(v.key) + '"' + (ex.events[v.key] ? ' checked' : '') + '> ' + esc(valueText(v)) + '</label>';
          }).join('') + '</div>';
        }
        if (s.numeric) {
          html += radio('atLeast', '이 값 이상이면 사건') + '<div class="sub"><input class="inline" type="text" inputmode="decimal" data-atleast="1" value="' + esc(ex.atLeast) + '" title="숫자를 입력하면 이 방식으로 바뀝니다"></div>';
        }
        if (ex.mode === 'auto' && s.valueCount !== 2) {
          html += '<div class="muted">이 변수는 값이 ' + s.valueCount + '가지입니다. 자동은 값이 2가지일 때만 됩니다. 값을 고르거나' + (s.numeric ? ' 기준값을 입력하세요.' : ' 직접 고르세요.') + '</div>';
        }
      }
      html += '</div>';
    }
    if (facs.length) {
      html += '<div class="opts"><div class="opts-title">범주형 독립변수의 기준 범주</div>' + facs.map(function (f) {
        var fs = state.summaries[f];
        if (!fs) return '<div>' + esc(f) + ': ' + wait + '</div>';
        if (fs.error) return '<div class="error">' + esc(f) + ': ' + esc(fs.error) + '</div>';
        if (fs.truncated) return '<div class="muted">' + esc(f) + ': 범주가 ' + fs.valueCount + '개로 너무 많아 기준을 고를 수 없습니다 (자동).</div>';
        var cur = ex.refs[f];
        if (cur !== undefined && !fs.values.some(function (v) { return v.key === cur; })) { delete ex.refs[f]; cur = undefined; }
        return '<label class="num"><span>' + esc(f) + '</span><select data-ref="' + esc(f) + '"><option value="">자동 (옵션 설정에 따름)</option>' +
          fs.values.map(function (v) { return '<option value="' + esc(v.key) + '"' + (cur === v.key ? ' selected' : '') + '>' + esc(valueText(v)) + '</option>'; }).join('') + '</select></label>';
      }).join('') + '</div>';
    }
    box.innerHTML = html;
  }

  /**
   * 변수를 역할 칸에 넣는다. 같은 분석의 다른 칸에 있던 변수는 그 칸에서 빼고(옮긴다),
   * 칸에 max 가 있으면 가장 최근에 보낸 변수만 남긴다.
   */
  function putInRole(role, name) {
    currentAnalysis().roles.forEach(function (r) {
      var l = assignOf(r), i = l.indexOf(name);
      if (i >= 0) l.splice(i, 1);
    });
    var list = assignOf(role);
    list.push(name);
    if (role.max && list.length > role.max) list.splice(0, list.length - role.max);
  }

  function sendChecked(roleKey) {
    var role = currentAnalysis().roles.filter(function (r) { return r.key === roleKey; })[0];
    Object.keys(state.checked).forEach(function (name) {
      var v = varInfo(name);
      if (v && state.checked[name] && role.accept.indexOf(v.scale) >= 0) putInRole(role, name);
      delete state.checked[name];
    });
    renderSetup();
  }

  function sendOne(name) {
    var v = varInfo(name);
    if (!v) return;
    var roles = acceptingRoles(v);
    if (!roles.length) return;
    // 이미 어느 칸에 있으면 그대로 두고, 아니면 받아 주는 칸 중 비어 있는 첫 칸(없으면 첫 칸)에 넣는다
    if (!isUsed(name)) {
      var empty = roles.filter(function (r) { return assignOf(r).length === 0; })[0];
      putInRole(empty || roles[0], name);
    }
    renderSetup();
  }

  /* ---------- 실행과 결과 ---------- */

  function setStatus(html) { $('status').innerHTML = html; }

  function buildRequest() {
    var a = currentAnalysis();
    var req = { analysis: state.analysis, options: {} };
    var opts = state.options[state.analysis] || {};
    a.options.forEach(function (o) {
      req.options[o.key] = o.type === 'number' || o.type === 'select'
        ? (opts[o.key] !== undefined ? opts[o.key] : String(o.def))
        : (opts[o.key] !== undefined ? !!opts[o.key] : !!o.def);
    });
    for (var i = 0; i < a.roles.length; i++) {
      var list = assignOf(a.roles[i]);
      if (!list.length) {
        if (a.roles[i].optional) continue;   // 선택 칸은 비워 둘 수 있다 (서버가 필요한 조합을 검증)
        return { error: '"' + a.roles[i].label + '" 칸에 변수를 보내세요.' };
      }
      req[a.roles[i].key] = list.slice();
    }
    if (a.extras === 'logistic') {
      var ex = extrasState();
      if (ex.mode === 'values') {
        var picked = Object.keys(ex.events);
        if (!picked.length) return { error: '"사건(1)으로 볼 값"에서 값을 하나 이상 고르세요.' };
        req.options.eventValues = picked;
      } else if (ex.mode === 'atLeast') {
        if (ex.atLeast === '' || !isFinite(Number(ex.atLeast))) return { error: '"이 값 이상이면 사건"에 숫자를 입력하세요.' };
        req.options.eventAtLeast = ex.atLeast;
      }
      var refs = {};
      roleList('factors').forEach(function (f) { if (ex.refs[f]) refs[f] = ex.refs[f]; });
      if (Object.keys(refs).length) req.options.refCategories = refs;
    }
    return { request: req };
  }

  function addResult(res) {
    resultCount++;
    var wrap = document.createElement('div');
    wrap.className = 'result-wrap';
    var t = new Date();
    var time = ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2) + ':' + ('0' + t.getSeconds()).slice(-2);
    wrap.dataset.id = String(resultCount);
    resultStore[resultCount] = res.result;
    wrap.innerHTML = '<div class="result-tools"><span>#' + resultCount + ' · ' + time + '</span><span>' +
      '<button type="button" data-export="1" title="결과 탭에 표를 씁니다">시트로 내보내기</button> ' +
      '<button type="button" data-delete="1">삭제</button></span></div>' + res.html;
    $('output').appendChild(wrap);
    $('empty').style.display = 'none';
    wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function run() {
    var built = buildRequest();
    if (built.error) { setStatus('<span class="error">' + esc(built.error) + '</span>'); return; }
    var wo = built.request.options || {};
    if ((wo.save || wo.saveD2) &&
        !confirm('분석 결과(예측값 등)를 데이터 탭 맨 오른쪽에 새 열로 저장하고 변수정의에도 등록합니다. 계속할까요? (같은 이름이 있으면 _2, _3 … 을 붙입니다. 원본 열은 바뀌지 않습니다.)')) return;
    if (wo.saveMatrix && !confirm('근접도 행렬을 새 탭에 저장합니다 (같은 이름이 있으면 _2, _3 … 을 붙입니다). 계속할까요?')) return;
    $('run').disabled = true;
    setStatus('계산 중…');
    google.script.run
      .withSuccessHandler(function (res) {
        $('run').disabled = false; setStatus(''); addResult(res);
        if ($('autoExport').checked) exportIds([String(resultCount)]);   // 옵션: 실행할 때마다 결과 탭에도 저장
      })
      .withFailureHandler(function (err) { $('run').disabled = false; setStatus('<span class="error">' + esc(friendlyError(err)) + '</span>'); })
      .runAnalysis(built.request);
  }

  /* ---------- 이벤트 ---------- */

  /** 분석 목록: 고급 분석이 꺼져 있으면 기본 분석만 보인다 (묶음에 보일 분석이 없으면 묶음도 숨긴다) */
  function buildAnalysisList() {
    var hidden = 0;
    $('analysis').innerHTML = ANALYSIS_GROUPS.map(function (g) {
      var keys = Object.keys(ANALYSES).filter(function (k) {
        if (ANALYSES[k].group !== g) return false;
        if (isLocked(k)) { hidden++; return false; }
        return true;
      });
      return keys.length ? '<optgroup label="' + esc(g) + '">' + keys.map(function (k) {
        return '<option value="' + k + '">' + esc(ANALYSES[k].label) + '</option>';
      }).join('') + '</optgroup>' : '';
    }).join('');
    if (isLocked(state.analysis) || !ANALYSES[state.analysis]) {
      var first = $('analysis').querySelector('option');
      if (first) state.analysis = first.value;
    }
    $('analysis').value = state.analysis;
    $('modeHint').textContent = mode.advanced
      ? '고급 분석이 켜져 있습니다 (끄려면 ' + mode.hint + ').'
      : (hidden ? '고급 분석 ' + hidden + '개는 숨겨져 있습니다 (' + mode.hint + ').' : '');
  }
  buildAnalysisList();
  $('analysis').addEventListener('change', function () {
    state.analysis = this.value;
    setStatus('');
    renderSetup();
  });

  $('varlist').addEventListener('change', function (e) {
    var li = e.target.closest('li');
    if (li && e.target.type === 'checkbox') { state.checked[li.dataset.name] = e.target.checked; if (advisor.open) renderAdvisor(); }
  });
  $('varlist').addEventListener('dblclick', function (e) {
    var li = e.target.closest('li');
    if (li && e.target.type !== 'checkbox') sendOne(li.dataset.name);
  });

  $('roles').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.send) { sendChecked(b.dataset.send); return; }
    if (b.dataset.remove) {
      var role = currentAnalysis().roles.filter(function (r) { return r.key === b.dataset.remove; })[0];
      var list = assignOf(role);
      var name = b.closest('.chip').dataset.name;
      list.splice(list.indexOf(name), 1);
      renderSetup();
    }
  });

  $('options').addEventListener('toggle', function (e) {            // toggle 은 버블링하지 않아 캡처로 받는다
    if (e.target.tagName === 'DETAILS') state.advOpen[state.analysis] = e.target.open;
  }, true);
  $('options').addEventListener('change', function (e) {
    if (e.target.dataset.opt) state.options[state.analysis][e.target.dataset.opt] = e.target.checked;
    if (e.target.dataset.optnum) state.options[state.analysis][e.target.dataset.optnum] = e.target.value.trim();
    if (e.target.dataset.optsel) { state.options[state.analysis][e.target.dataset.optsel] = e.target.value; renderSetup(); }
    scheduleSave();
  });

  $('extras').addEventListener('change', function (e) {
    var ex = extrasState(), t = e.target;
    if (t.name === 'evmode') { ex.mode = t.value; renderExtras(); }
    else if (t.dataset.ev !== undefined) { if (t.checked) ex.events[t.dataset.ev] = true; else delete ex.events[t.dataset.ev]; }
    else if (t.dataset.ref !== undefined) { if (t.value) ex.refs[t.dataset.ref] = t.value; else delete ex.refs[t.dataset.ref]; }
  });
  $('extras').addEventListener('input', function (e) {
    if (e.target.dataset.atleast === undefined) return;
    var ex = extrasState();
    ex.atLeast = e.target.value.trim();
    if (ex.mode !== 'atLeast') {          // 숫자를 입력하기 시작하면 이 방식으로 바꾼다 (다시 그린 뒤 입력 칸을 되살린다)
      ex.mode = 'atLeast';
      renderExtras();
      var box = $('extras').querySelector('[data-atleast]');
      if (box) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
    }
  });

  /* ---------- 시트로 내보내기 ---------- */

  var exportProgress = '';       // 진행 중인 내보내기의 현재 안내 문구
  var exporting = false;         // 내보내기가 진행 중이면 다시 누르는 것을 막는다

  function setExportStatus(html) { $('exportStatus').innerHTML = html; }
  function setExportProgress(html) { exportProgress = html; setExportStatus(html); }

  /** 진행 중에는 내보내기 버튼을 흐리게 하고 글자를 바꾼다 (disabled 로 하면 다시 눌러도 안내를 줄 수 없다) */
  function setExportBusy(on) {
    exporting = on;
    [].forEach.call(document.querySelectorAll('#exportAll, [data-export]'), function (b) {
      if (on) {
        if (!b.dataset.label) b.dataset.label = b.textContent;
        b.textContent = '내보내는 중…';
        b.classList.add('busy');
      } else {
        if (b.dataset.label) b.textContent = b.dataset.label;
        b.classList.remove('busy');
      }
    });
  }

  function finishExport(html) {
    setExportBusy(false);
    exportProgress = '';
    setExportStatus(html);
  }

  /**
   * SVG 요소를 PNG(base64, 2배 해상도)로 바꾼다. 서버(Apps Script)는 SVG를 이미지로 바꿀 수 없어서
   * 브라우저의 canvas 로 바꾼 뒤 보낸다. 변환하지 못하면 null (그 차트는 안내 줄만 시트에 남는다).
   */
  function svgToPng(svg) {
    return new Promise(function (resolve) {
      try {
        var w = Math.round(parseFloat(svg.getAttribute('width'))), h = Math.round(parseFloat(svg.getAttribute('height')));
        if (!(w > 0 && h > 0)) { resolve(null); return; }
        var img = new Image();
        img.onload = function () {
          try {
            var canvas = document.createElement('canvas');
            canvas.width = w * 2; canvas.height = h * 2;
            var ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve({ png: canvas.toDataURL('image/png').split(',')[1], width: w, height: h });
          } catch (e) { resolve(null); }
        };
        img.onerror = function () { resolve(null); };
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(svg));
      } catch (e) { resolve(null); }
    });
  }

  /** 결과마다, 그 결과의 차트 블록 순서대로 화면의 SVG 를 PNG 로 바꾼다 (그릴 데이터가 없던 차트는 null) */
  function collectChartImages(ids) {
    return Promise.all(ids.map(function (id) {
      var wrap = $('output').querySelector('.result-wrap[data-id="' + id + '"]');
      var charts = resultStore[id].blocks.filter(function (b) { return b.type === 'chart'; }).length;
      var jobs = [];
      for (var k = 0; k < charts; k++) {
        var svg = wrap ? wrap.querySelector('.chart-slot[data-chart="' + k + '"] svg') : null;
        jobs.push(svg ? svgToPng(svg) : Promise.resolve(null));
      }
      return Promise.all(jobs);
    }));
  }

  function exportIds(allIds) {
    var ids = allIds.filter(function (id) { return resultStore[id]; });
    if (exporting) {
      // 이미 진행 중: 다시 실행하지 않고 알린 뒤, 잠시 후 진행 문구로 되돌린다
      setExportStatus('<span class="notice">이미 시트로 내보내는 중입니다. 끝날 때까지 기다려 주세요. 다시 누르지 않아도 됩니다.</span>');
      setTimeout(function () { if (exporting) setExportStatus(exportProgress); }, 3000);
      return;
    }
    if (!ids.length) { setExportStatus('<span class="error">내보낼 결과가 없습니다.</span>'); return; }
    var results = ids.map(function (id) { return resultStore[id]; });
    var totalCharts = results.reduce(function (s, r) { return s + r.blocks.filter(function (b) { return b.type === 'chart'; }).length; }, 0);
    setExportBusy(true);
    setExportProgress(totalCharts ? '차트를 그림으로 바꾸는 중…' : '시트에 쓰는 중… (몇 초 걸릴 수 있습니다)');
    collectChartImages(ids).then(function (images) {
      var made = images.reduce(function (s, list) { return s + list.filter(Boolean).length; }, 0);
      setExportProgress('시트에 쓰는 중… (몇 초 걸릴 수 있습니다)');
      google.script.run
        .withSuccessHandler(function (r) {
          var msg = '"' + esc(r.sheet) + '" 탭 ' + r.firstRow + '~' + r.lastRow + '행에 결과 ' + results.length + '개를 썼습니다.';
          if (totalCharts) {
            msg += ' 차트 ' + r.images + '개를 그림으로 넣었습니다.' + (made < totalCharts ? ' (' + (totalCharts - made) + '개는 변환하지 못해 안내 줄만 남겼습니다.)' : '');
            if (r.sheetImages !== null && r.sheetImages !== undefined) msg += ' 결과 탭의 그림 수: ' + r.sheetImages + '개.';
          }
          if (r.imageErrors && r.imageErrors.length) {
            msg += '<br><span class="error">그림을 넣지 못했습니다: ' + r.imageErrors.map(esc).join(' / ') + '</span>';
          } else if (r.images > 0 && r.sheetImages === 0) {
            msg += '<br><span class="error">그림 삽입이 오류 없이 끝났지만 결과 탭에 그림이 없습니다. 실행 로그(확장 프로그램 > Apps Script > 실행)를 확인해 주세요.</span>';
          }
          // 시트가 그림을 늦게 그리는 경우가 있어서(실제로 몇 초~수십 초 뒤에 나타난 적이 있다) 미리 알려 둔다
          if (r.images > 0) msg += '<br><span class="muted">그림은 시트에 표시되기까지 몇 초 걸릴 수 있습니다.</span>';
          finishExport(msg);
        })
        .withFailureHandler(function (err) { finishExport('<span class="error">' + esc(friendlyError(err)) + '</span>'); })
        .exportResults(results, images);
    }).catch(function (err) { finishExport('<span class="error">' + esc(err && err.message ? err.message : err) + '</span>'); });
  }

  function visibleResultIds() {
    return [].map.call($('output').querySelectorAll('.result-wrap'), function (w) { return w.dataset.id; });
  }

  $('output').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    var wrap = b.closest('.result-wrap');
    if (b.dataset.delete) {
      delete resultStore[wrap.dataset.id];
      wrap.remove();
      if (!$('output').children.length) $('empty').style.display = '';
    } else if (b.dataset.export) {
      exportIds([wrap.dataset.id]);
    }
  });
  $('exportAll').addEventListener('click', function () { exportIds(visibleResultIds()); });
  $('clear').addEventListener('click', function () {
    $('output').innerHTML = '';
    resultStore = {};
    setExportStatus('');
    $('empty').style.display = '';
  });

  /* ---------- 옵션 기억 (사용자 속성) ---------- */

  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      google.script.run.withFailureHandler(function () {}).saveOptions(state.options);   // 저장하지 못해도 분석에는 영향이 없다
    }, 600);
  }

  /** 저장된 옵션 중 현재 분석 정의에 있는 키만, 알맞은 형식으로 복원한다 */
  function applySavedOptions(saved) {
    if (!saved || typeof saved !== 'object') return;
    if (saved.ui && typeof saved.ui.autoExport === 'boolean') {
      $('autoExport').checked = saved.ui.autoExport;
      state.options.ui = { autoExport: saved.ui.autoExport };
    }
    Object.keys(ANALYSES).forEach(function (key) {
      var s = saved[key];
      if (!s || typeof s !== 'object') return;
      ANALYSES[key].options.forEach(function (o) {
        var v = s[o.key];
        if (v === undefined) return;
        var opts = state.options[key] = state.options[key] || {};
        if (o.type === 'number') {
          if (typeof v === 'string' || typeof v === 'number') opts[o.key] = String(v);
        } else if (o.type === 'select') {
          if (typeof v === 'string' && o.choices.some(function (c) { return c[0] === v; })) opts[o.key] = v;
        } else if (typeof v === 'boolean') {
          opts[o.key] = v;
        }
      });
    });
    renderSetup();
  }

  /* ---------- 분석 선택 도우미 ---------- */

  var advisor = { data: null, loading: false, open: false, path: [], auto: null, error: '' };

  function advNode() {
    var node = advisor.data.tree;
    advisor.path.forEach(function (i) { node = node.choices[i].next; });
    return node;
  }

  function advName(key) { return ANALYSES[key] ? ANALYSES[key].label : key; }

  /** 변수 목록 순서대로 체크한 변수 이름 */
  function checkedNames() {
    return state.info ? state.info.vars.filter(function (v) { return state.checked[v.name]; }).map(function (v) { return v.name; }) : [];
  }

  function advOpenBtn(key, label, roles, cls) {
    if (isLocked(key)) return '<span class="muted">' + (cls === 'linkbtn' ? esc(label) + ' — ' : '') + '고급 분석입니다. ' + esc(mode.hint) + '로 켠 뒤 열 수 있습니다.</span>';
    return '<button type="button" class="' + cls + '" data-advopen="' + esc(key) + '"' + (roles ? ' data-advroles="' + esc(JSON.stringify(roles)) + '"' : '') + '>' + esc(label) + '</button>';
  }

  /** 추천 카드: rec { key, why, parametric } 또는 { name, unsupported, fallback, why }, alts [{ key, why, roles? }], notes, roles(자동 배치) */
  function advCard(rec, alts, notes, roles) {
    var h = '<div class="card">';
    if (rec.unsupported) {
      h += '<div class="rec warn">' + esc(rec.name) + ' (아직 지원하지 않음)</div><div>' + esc(rec.why) + '</div>' +
        '<div class="muted">지금은 대신 <b>' + esc(advName(rec.fallback)) + '</b>을(를) 쓸 수 있습니다.</div>' + advOpenBtn(rec.fallback, advName(rec.fallback) + ' 열기', null, 'choice');
    } else {
      h += '<div class="rec">추천: ' + esc(advName(rec.key)) + '</div><div>' + esc(rec.why) + '</div>' +
        advOpenBtn(rec.key, roles ? '이 분석 열기 (체크한 변수를 자동으로 넣음)' : '이 분석 열기', roles, 'choice');
    }
    var extra = (notes || []).slice();
    if (!rec.unsupported && rec.parametric && advisor.data && state.info && state.info.n < advisor.data.smallN) extra.push(advisor.data.smallNote);
    if (alts && alts.length) {
      h += '<div class="muted" style="margin-top:4px">함께 볼 만한 분석</div><ul>' + alts.map(function (a) {
        return '<li>' + advOpenBtn(a.key, advName(a.key), a.roles, 'linkbtn') + ' — ' + esc(a.why) + '</li>';
      }).join('') + '</ul>';
    }
    if (extra.length) h += '<ul>' + extra.map(function (n) { return '<li class="muted">' + esc(n) + '</li>'; }).join('') + '</ul>';
    return h + '</div>';
  }

  function renderAdvisor() {
    var box = $('advisor');
    if (!advisor.open) { box.hidden = true; return; }
    box.hidden = false;
    var h = '<div class="advisor-head"><span>분석 선택 도우미</span><button type="button" class="linkbtn" data-advclose="1">닫기 ×</button></div>';
    if (advisor.error) h += '<p class="error">' + esc(advisor.error) + '</p>';
    var names = checkedNames();
    if (names.length) {
      h += '<div class="muted" style="margin-top:6px">체크한 변수: ' + esc(names.join(', ')) + '</div>' +
        '<button type="button" class="choice" data-advauto="1">체크한 변수로 바로 추천받기</button>';
    } else {
      h += '<div class="muted" style="margin-top:6px">변수 목록에서 변수를 체크하면 그 변수로 바로 추천받을 수 있습니다. 아니면 아래 질문에 답하세요.</div>';
    }
    if (advisor.auto) {
      h += advisor.auto.none ? '<div class="card warn">' + esc(advisor.auto.message) + '</div>'
        : advCard({ key: advisor.auto.key, why: advisor.auto.why, parametric: ['ttestInd', 'anova', 'correlation'].indexOf(advisor.auto.key) >= 0 }, advisor.auto.alt, advisor.auto.notes, advisor.auto.roles);
    }
    if (!advisor.data) {
      h += advisor.error ? '' : '<p class="muted">불러오는 중…</p>';
    } else {
      var node = advNode();
      if (node.q) {
        h += '<div class="q">' + esc(node.q) + '</div>' + node.choices.map(function (c, i) {
          return '<button type="button" class="choice" data-advchoice="' + i + '">' + esc(c.label) + '</button>';
        }).join('');
      } else {
        h += advCard(node.rec, node.alt, node.notes, null);
      }
      if (advisor.path.length) h += '<div class="nav"><button type="button" class="linkbtn" data-advback="1">← 이전 질문</button><button type="button" class="linkbtn" data-advreset="1">처음부터</button></div>';
    }
    box.innerHTML = h;
  }

  function loadAdvisor() {
    if (advisor.data || advisor.loading) return;
    advisor.loading = true;
    google.script.run
      .withSuccessHandler(function (d) { advisor.data = d; advisor.loading = false; advisor.error = ''; renderAdvisor(); })
      .withFailureHandler(function (err) { advisor.loading = false; advisor.error = err.message || String(err); renderAdvisor(); })
      .getAdvisor();
  }

  /** 추천한 분석을 분석 창에서 연다. roles 가 있으면 변수를 역할 칸에 넣는다 */
  function openAdvised(key, roles) {
    if (!ANALYSES[key] || isLocked(key)) return;
    state.analysis = key;
    $('analysis').value = key;
    state.assign[key] = {};
    if (roles) {
      Object.keys(roles).forEach(function (rk) {
        var role = ANALYSES[key].roles.filter(function (r) { return r.key === rk; })[0];
        if (role) roles[rk].forEach(function (n) { if (varInfo(n)) putInRole(role, n); });
      });
      state.checked = {};
    }
    setStatus('');
    renderSetup();
    advisor.open = false;
    renderAdvisor();
  }

  $('advisorOpen').addEventListener('click', function () {
    advisor.open = !advisor.open;
    if (advisor.open) loadAdvisor();
    renderAdvisor();
  });
  $('advisor').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    var d = b.dataset;
    if (d.advclose) { advisor.open = false; }
    else if (d.advchoice !== undefined) { advisor.path.push(Number(d.advchoice)); advisor.auto = null; }
    else if (d.advback) { advisor.path.pop(); }
    else if (d.advreset) { advisor.path = []; advisor.auto = null; }
    else if (d.advopen) { openAdvised(d.advopen, d.advroles ? JSON.parse(d.advroles) : null); return; }
    else if (d.advauto) {
      advisor.error = '';
      google.script.run
        .withSuccessHandler(function (res) { advisor.auto = res; renderAdvisor(); })
        .withFailureHandler(function (err) { advisor.error = err.message || String(err); renderAdvisor(); })
        .adviseFromVariables(checkedNames());
      return;
    }
    renderAdvisor();
  });

  $('run').addEventListener('click', run);
  $('reload').addEventListener('click', reload);
  $('varSearch').addEventListener('input', renderVars);
  $('autoExport').addEventListener('change', function () {
    state.options.ui = { autoExport: this.checked };
    scheduleSave();
  });
  // 옵션 칸(숫자·글자 입력)에서 Enter 를 누르면 실행한다
  $('options').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target && e.target.tagName === 'INPUT' && e.target.type === 'text') { e.preventDefault(); run(); }
  });
  renderSetup();
  reload();
  google.script.run.withSuccessHandler(applySavedOptions).withFailureHandler(function () {}).getSavedOptions();
</script>
