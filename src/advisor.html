<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body { font: 13px/1.5 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color: #202124; margin: 0; padding: 14px 18px; }
    h1 { font-size: 17px; margin: 0 0 2px; }
    .muted { color: #5f6368; }
    .layout { display: grid; grid-template-columns: 290px 1fr; gap: 18px; margin-top: 12px; }
    .side { border-right: 1px solid #dadce0; padding-right: 14px; }
    .side h2, .main h2 { font-size: 14px; margin: 0 0 6px; }
    .vars { max-height: 440px; overflow: auto; border: 1px solid #dadce0; border-radius: 4px; padding: 4px 6px; margin: 6px 0; }
    .vars label { display: flex; align-items: center; gap: 6px; padding: 2px 0; cursor: pointer; }
    .badge { font-size: 10px; padding: 0 5px; border-radius: 8px; background: #e8eaed; color: #3c4043; }
    .badge.scale { background: #d2e3fc; } .badge.ordinal { background: #fde7c8; } .badge.nominal { background: #d3f0d9; }
    button { font: inherit; cursor: pointer; }
    .primary { background: #1a73e8; color: #fff; border: none; border-radius: 4px; padding: 6px 12px; }
    .primary:disabled { background: #a8c7fa; cursor: default; }
    .link { border: none; background: none; color: #1a73e8; padding: 2px 0; text-align: left; }
    .link:hover { text-decoration: underline; }
    .trail { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
    .chip { border: 1px solid #c6dafc; background: #f5f9ff; border-radius: 14px; padding: 2px 10px; }
    .chip:hover { background: #e8f0fe; }
    .q { font-size: 16px; font-weight: bold; margin: 6px 0 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
    .card-choice { text-align: left; border: 1px solid #dadce0; background: #fff; border-radius: 8px; padding: 12px; min-height: 64px; }
    .card-choice:hover { border-color: #1a73e8; background: #f5f9ff; }
    .result { border: 1px solid #1a73e8; border-radius: 8px; padding: 14px; background: #fff; margin: 8px 0 12px; }
    .result.alt { border-color: #dadce0; }
    .rec { font-size: 18px; font-weight: bold; margin-bottom: 4px; }
    .warn { color: #b06000; }
    .error { color: #c5221f; }
    ul { margin: 4px 0 4px 18px; padding: 0; }
    .nav { margin-top: 10px; display: flex; gap: 14px; }
  </style>
</head>
<body>
  <h1>분석 선택 도우미</h1>
  <div class="muted">질문에 답하거나 내 변수를 체크하면 어떤 분석을 쓸지 추천합니다. 추천한 분석은 <b>분석 창</b>에서 (변수가 채워진 채) 열립니다.</div>
  <div class="layout">
    <aside class="side">
      <h2>내 변수로 바로 추천받기</h2>
      <div class="muted" id="summary">변수를 불러오는 중…</div>
      <div class="vars" id="vars"></div>
      <button class="primary" id="auto" type="button" disabled>체크한 변수로 추천받기</button>
      <div class="muted" style="margin-top:6px">변수를 1~2개 체크하는 것이 가장 정확합니다. 아래 질문으로도 고를 수 있습니다.</div>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <script>
    var advisor = null, info = null, path = [], auto = null, error = '';

    function $(id) { return document.getElementById(id); }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
    }
    function name(key) { return advisor && advisor.labels[key] ? advisor.labels[key] : key; }
    var SCALE = { scale: '연속', ordinal: '서열', nominal: '명목' };

    function checkedNames() {
      return info ? [].slice.call(document.querySelectorAll('#vars input:checked')).map(function (b) { return b.value; }) : [];
    }

    function renderVars() {
      $('vars').innerHTML = info.vars.map(function (v) {
        return '<label><input type="checkbox" value="' + esc(v.name) + '"><span class="badge ' + v.scale + '">' + SCALE[v.scale] + '</span> ' + esc(v.name) + '</label>';
      }).join('') || '<span class="muted">변수가 없습니다.</span>';
      $('summary').textContent = '사례 ' + info.n + '건 · 변수 ' + info.vars.length + '개';
    }

    function openBtn(key, label, roles, cls) {
      if (advisor && advisor.advanced === false && (advisor.advancedKeys || []).indexOf(key) >= 0) return '<span class="muted">' + (cls === 'link' ? esc(label) + ' — ' : '') + '고급 분석입니다. ' + esc(advisor.advancedHint) + '로 켠 뒤 열 수 있습니다.</span>';
      return '<button type="button" class="' + cls + '" data-open="' + esc(key) + '"' + (roles ? ' data-roles="' + esc(JSON.stringify(roles)) + '"' : '') + '>' + esc(label) + '</button>';
    }

    /** 추천 카드 (넓은 화면용). rec: { key, why, parametric } 또는 { name, unsupported, fallback, why } */
    function card(rec, alts, notes, roles, cls) {
      var h = '<div class="result ' + (cls || '') + '">';
      if (rec.unsupported) {
        h += '<div class="rec warn">' + esc(rec.name) + ' <span style="font-size:13px">(아직 지원하지 않음)</span></div><div>' + esc(rec.why) + '</div>' +
          '<div class="muted" style="margin:6px 0">지금은 대신 <b>' + esc(name(rec.fallback)) + '</b>을(를) 쓸 수 있습니다.</div>' + openBtn(rec.fallback, name(rec.fallback) + ' — 분석 창에서 열기', null, 'primary');
      } else {
        h += '<div class="muted">추천 분석</div><div class="rec">' + esc(name(rec.key)) + '</div><div style="margin-bottom:8px">' + esc(rec.why) + '</div>' +
          openBtn(rec.key, roles ? '분석 창에서 열기 (체크한 변수를 자동으로 넣음)' : '분석 창에서 열기', roles, 'primary');
      }
      var extra = (notes || []).slice();
      if (!rec.unsupported && rec.parametric && info && info.n < advisor.smallN) extra.push(advisor.smallNote);
      if (alts && alts.length) {
        h += '<div style="margin-top:10px"><b>함께 볼 만한 분석</b></div><ul>' + alts.map(function (a) {
          return '<li>' + openBtn(a.key, name(a.key), a.roles, 'link') + ' — ' + esc(a.why) + '</li>';
        }).join('') + '</ul>';
      }
      if (extra.length) h += '<div style="margin-top:10px"><b>참고</b></div><ul>' + extra.map(function (n) { return '<li class="muted">' + esc(n) + '</li>'; }).join('') + '</ul>';
      return h + '</div>';
    }

    function render() {
      var h = '';
      if (error) h += '<p class="error">' + esc(error) + '</p>';
      if (auto) {
        h += '<h2>체크한 변수로 추천</h2>';
        h += auto.none ? '<div class="result alt warn">' + esc(auto.message) + '</div>' : card({ key: auto.key, why: auto.why, parametric: ['ttestInd', 'anova', 'correlation'].indexOf(auto.key) >= 0 }, auto.alt, auto.notes, auto.roles, '');
        h += '<hr style="border:none;border-top:1px solid #dadce0;margin:14px 0">';
      }
      if (!advisor) { $('main').innerHTML = h + '<p class="muted">불러오는 중…</p>'; return; }
      var node = advisor.tree, trail = [];
      path.forEach(function (i) { trail.push({ q: node.q, label: node.choices[i].label }); node = node.choices[i].next; });
      h += '<h2>질문으로 고르기</h2>';
      if (trail.length) {
        h += '<div class="trail">' + trail.map(function (t, k) { return '<button type="button" class="chip" data-back="' + k + '" title="이 질문으로 돌아가기">' + (k + 1) + '. ' + esc(t.label) + '</button>'; }).join('') + '</div>';
      }
      if (node.q) {
        h += '<div class="q">' + esc(node.q) + '</div><div class="grid">' + node.choices.map(function (c, i) {
          return '<button type="button" class="card-choice" data-choice="' + i + '">' + esc(c.label) + '</button>';
        }).join('') + '</div>';
      } else {
        h += card(node.rec, node.alt, node.notes, null, '');
      }
      if (path.length) h += '<div class="nav"><button type="button" class="link" data-back="' + (path.length - 1) + '">← 이전 질문</button><button type="button" class="link" data-reset="1">처음부터</button></div>';
      $('main').innerHTML = h;
    }

    $('main').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      var d = b.dataset;
      if (d.choice !== undefined) { path.push(Number(d.choice)); auto = null; render(); }
      else if (d.back !== undefined) { path = path.slice(0, Number(d.back)); render(); }
      else if (d.reset) { path = []; auto = null; render(); }
      else if (d.open) { openAnalysis(d.open, d.roles ? JSON.parse(d.roles) : null, b); }
    });

    function openAnalysis(key, roles, btn) {
      btn.disabled = true;
      var old = btn.textContent;
      btn.textContent = '분석 창을 여는 중…';
      google.script.run
        .withSuccessHandler(function () { google.script.host.close(); })
        .withFailureHandler(function (err) { btn.disabled = false; btn.textContent = old; error = err.message || String(err); render(); })
        .openAnalysisWith(key, roles);
    }

    $('vars').addEventListener('change', function () { $('auto').disabled = checkedNames().length === 0; });
    $('auto').addEventListener('click', function () {
      var names = checkedNames();
      if (!names.length) return;
      $('auto').disabled = true;
      google.script.run
        .withSuccessHandler(function (res) { auto = res; error = ''; $('auto').disabled = false; render(); window.scrollTo(0, 0); })
        .withFailureHandler(function (err) { error = err.message || String(err); $('auto').disabled = false; render(); })
        .adviseFromVariables(names);
    });

    google.script.run.withSuccessHandler(function (d) { advisor = d; render(); }).withFailureHandler(function (err) { error = err.message || String(err); render(); }).getAdvisor();
    google.script.run.withSuccessHandler(function (i) { info = i; renderVars(); render(); }).withFailureHandler(function (err) { $('summary').innerHTML = '<span class="error">' + esc(err.message || err) + '</span>'; }).getDatasetInfo();
    render();
  </script>
</body>
</html>
